<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Coordinate Offset Calculator</title>
<style>
  :root {
    --bg: #eef1f6; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --border: #e2e8f0; --accent: #2563eb; --accent-2: #7c3aed; --accent-text: #ffffff;
    --accent-soft: #e8efff;
    --ok: #12803c; --ok-bg: #e3f6ea; --bad: #dc2626; --bad-bg: #fde8e6;
    --input-bg: #f6f8fb; --shadow: 0 1px 2px rgba(15,23,42,.05), 0 8px 24px rgba(15,23,42,.06);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e14; --card: #151a23; --text: #e8ecf3; --muted: #8a94a6;
      --border: #252c38; --accent: #5b8cff; --accent-2: #a78bfa; --accent-text: #06101f;
      --accent-soft: #1a2540;
      --ok: #4ade80; --ok-bg: #12301d; --bad: #ff7b72; --bad-bg: #3a1714;
      --input-bg: #0f131a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; align-items: center; gap: 14px; padding: 4px 2px 8px; }
  .logo {
    flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
  }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: .75rem; margin: 0 0 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: .9rem; }
  .layout { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
    .sticky { position: sticky; top: 16px; }
  }
  .stack { display: grid; gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow);
  }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  fieldset + fieldset { margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--border); }
  legend { padding: 0; margin-bottom: 10px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid > *, .offset-wrap > * { min-width: 0; }
  @media (max-width: 480px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  label { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  label small { font-weight: 500; opacity: .85; }
  .field {
    display: flex; align-items: stretch; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; transition: border-color .15s, box-shadow .15s;
  }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .field.invalid { border-color: var(--bad); }
  input[type=text] {
    flex: 1; min-width: 0; height: 50px; font-size: 18px; /* >=16px prevents iOS zoom */
    padding: 0 14px; border: 0; outline: 0; background: transparent; color: var(--text);
    font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none;
  }
  .unit { align-self: center; padding-right: 12px; color: var(--muted); font-size: .85rem; font-weight: 600; }
  .err { color: var(--bad); font-size: .78rem; min-height: 1.1em; margin-top: 3px; }
  button, .btn {
    font: inherit; font-weight: 600; min-height: 46px; padding: 0 18px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: background .15s, opacity .15s;
  }
  button:hover, .btn:hover { background: var(--accent-soft); }
  button:active, .btn:active { opacity: .7; }
  button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
  button.primary:hover { filter: brightness(1.08); }
  button.pm { border: 0; border-left: 1px solid var(--border); border-radius: 0; width: 46px; padding: 0; min-height: 0; background: transparent; color: var(--muted); font-size: 1.05rem; }
  button.pm:hover { background: var(--accent-soft); color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .row > * { flex: 1 1 140px; }
  .offset-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  @media (min-width: 520px) { .offset-wrap { grid-template-columns: minmax(0, 1fr) 130px; align-items: center; } }
  .compass { width: 100%; max-width: 170px; margin: 0 auto; display: block; }
  .compass .ring { fill: var(--input-bg); stroke: var(--border); stroke-width: 1.5; }
  .compass .tick { stroke: var(--border); stroke-width: 1.5; }
  .compass text { fill: var(--muted); font: 600 11px -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
  .compass .n { fill: var(--bad); }
  .compass .hdg { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; fill: var(--accent); }
  .compass .vec { stroke: var(--accent-2); stroke-width: 2; stroke-dasharray: 4 3; }
  .compass .pt { fill: var(--accent-2); }
  .compass .org { fill: var(--text); }
  .hero {
    border-radius: 14px; padding: 16px; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .hero .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
  .result-main { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; word-break: break-word; margin-top: 4px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stat { background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .stat .k { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; word-break: break-word; }
  .empty { color: var(--muted); }
  .placeholder { text-align: center; padding: 28px 8px; }
  details.card > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: "+"; font-size: 1.2rem; line-height: 1; }
  details.card[open] > summary::after { content: "–"; }
  details.card[open] > summary { margin-bottom: 14px; }
  ul.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.history button { width: 100%; justify-content: flex-start; text-align: left; flex-direction: column; align-items: flex-start; padding: 10px 14px; font-weight: 500; font-size: .92rem; background: var(--input-bg); }
  .small { color: var(--muted); font-size: .8rem; }
  .tests li { list-style: none; padding: 8px 12px; border-radius: 10px; margin-bottom: 6px; font-size: .92rem; }
  .tests { padding: 0; margin: 12px 0 0; }
  .pass { background: var(--ok-bg); color: var(--ok); }
  .fail { background: var(--bad-bg); color: var(--bad); }
  .toast { min-height: 1.2em; color: var(--ok); font-size: .9rem; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5z"/></svg>
    </div>
    <div>
      <h1>Coordinate Offset Calculator</h1>
      <p class="sub">Point <b>x</b> m forward and <b>y</b> m right of an origin, for a given heading (WGS84 geodesic).</p>
    </div>
  </header>

  <div class="layout">
    <section class="card" aria-labelledby="in-h">
      <h2 id="in-h">Inputs</h2>
      <form id="form" novalidate autocomplete="off">
        <fieldset>
          <legend>Origin</legend>
          <div class="grid">
            <div>
              <label for="lat">Latitude</label>
              <div class="field" id="lat-f"><input id="lat" type="text" inputmode="decimal" placeholder="37.7749" enterkeyhint="next"><span class="unit">°</span><button type="button" class="pm" data-pm="lat" aria-label="Toggle sign of latitude">±</button></div>
              <div class="err" id="lat-e"></div>
            </div>
            <div>
              <label for="lon">Longitude</label>
              <div class="field" id="lon-f"><input id="lon" type="text" inputmode="decimal" placeholder="-122.4194" enterkeyhint="next"><span class="unit">°</span><button type="button" class="pm" data-pm="lon" aria-label="Toggle sign of longitude">±</button></div>
              <div class="err" id="lon-e"></div>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Offset</legend>
          <div class="offset-wrap">
            <div style="display:grid;gap:12px">
              <div class="grid">
                <div>
                  <label for="x">x <small>forward</small></label>
                  <div class="field" id="x-f"><input id="x" type="text" inputmode="decimal" placeholder="100" enterkeyhint="next"><span class="unit">m</span><button type="button" class="pm" data-pm="x" aria-label="Toggle sign of x">±</button></div>
                  <div class="err" id="x-e"></div>
                </div>
                <div>
                  <label for="y">y <small>right</small></label>
                  <div class="field" id="y-f"><input id="y" type="text" inputmode="decimal" placeholder="50" enterkeyhint="next"><span class="unit">m</span><button type="button" class="pm" data-pm="y" aria-label="Toggle sign of y">±</button></div>
                  <div class="err" id="y-e"></div>
                </div>
              </div>
              <div>
                <label for="psi">Heading ψ <small>clockwise from North</small></label>
                <div class="field" id="psi-f"><input id="psi" type="text" inputmode="decimal" placeholder="90" enterkeyhint="done"><span class="unit">°</span></div>
                <div class="err" id="psi-e"></div>
              </div>
            </div>
            <svg class="compass" viewBox="-100 -100 200 200" role="img" aria-label="Preview of heading and target point">
              <circle class="ring" r="92"/>
              <line class="tick" x1="0" y1="-92" x2="0" y2="-80"/><line class="tick" x1="92" y1="0" x2="80" y2="0"/>
              <line class="tick" x1="0" y1="92" x2="0" y2="80"/><line class="tick" x1="-92" y1="0" x2="-80" y2="0"/>
              <text class="n" x="0" y="-64">N</text><text x="68" y="4">E</text><text x="0" y="72">S</text><text x="-68" y="4">W</text>
              <line class="vec" id="c-vec" x1="0" y1="0" x2="0" y2="0" visibility="hidden"/>
              <g id="c-hdg"><line class="hdg" x1="0" y1="0" x2="0" y2="-34"/><polygon class="hdg" points="0,-48 -7,-34 7,-34"/></g>
              <circle class="pt" id="c-pt" r="6" cx="0" cy="0" visibility="hidden"/>
              <circle class="org" r="4"/>
            </svg>
          </div>
        </fieldset>

        <div class="row">
          <button type="submit" class="primary">Calculate &amp; save</button>
          <button type="button" id="reset">Clear</button>
        </div>
      </form>
    </section>

    <div class="stack sticky">
      <section class="card" aria-labelledby="out-h" aria-live="polite">
        <h2 id="out-h">Result</h2>
        <div id="result"><div class="empty placeholder">Enter valid inputs to see the result.</div></div>
      </section>

      <details class="card">
        <summary>History</summary>
        <div id="history"></div>
        <div class="row"><button type="button" id="clear-history">Clear history</button></div>
      </details>

      <details class="card">
        <summary>Self-tests</summary>
        <div class="row" style="margin-top:0"><button type="button" id="run-tests">Run tests</button></div>
        <ul class="tests" id="tests"></ul>
      </details>
    </div>
  </div>
</main>

<script>
"use strict";

// ---------- Geodesy (WGS84, Vincenty direct) ----------
const WGS84 = { a: 6378137, f: 1 / 298.257223563 };
const rad = d => d * Math.PI / 180;
const deg = r => r * 180 / Math.PI;
const norm360 = d => ((d % 360) + 360) % 360;
const normLon = d => ((d + 540) % 360 + 360) % 360 - 180;

/** Vincenty direct: start (lat, lon deg), azimuth (deg from N), distance s (m). */
function vincentyDirect(latDeg, lonDeg, azDeg, s) {
  const { a, f } = WGS84, b = a * (1 - f);
  if (s === 0) return { lat: latDeg, lon: lonDeg };
  const al1 = rad(azDeg), sinAl1 = Math.sin(al1), cosAl1 = Math.cos(al1);
  const tanU1 = (1 - f) * Math.tan(rad(latDeg));
  const cosU1 = 1 / Math.sqrt(1 + tanU1 * tanU1), sinU1 = tanU1 * cosU1;
  const sig1 = Math.atan2(tanU1, cosAl1);
  const sinAl = cosU1 * sinAl1, cos2Al = 1 - sinAl * sinAl;
  const u2 = cos2Al * (a * a - b * b) / (b * b);
  const A = 1 + u2 / 16384 * (4096 + u2 * (-768 + u2 * (320 - 175 * u2)));
  const B = u2 / 1024 * (256 + u2 * (-128 + u2 * (74 - 47 * u2)));
  let sig = s / (b * A), sinSig, cosSig, cos2SigM, prev, i = 0;
  do {
    cos2SigM = Math.cos(2 * sig1 + sig);
    sinSig = Math.sin(sig); cosSig = Math.cos(sig);
    const dSig = B * sinSig * (cos2SigM + B / 4 * (cosSig * (-1 + 2 * cos2SigM * cos2SigM)
      - B / 6 * cos2SigM * (-3 + 4 * sinSig * sinSig) * (-3 + 4 * cos2SigM * cos2SigM)));
    prev = sig;
    sig = s / (b * A) + dSig;
  } while (Math.abs(sig - prev) > 1e-12 && ++i < 200);
  const tmp = sinU1 * sinSig - cosU1 * cosSig * cosAl1;
  const lat2 = Math.atan2(sinU1 * cosSig + cosU1 * sinSig * cosAl1,
                          (1 - f) * Math.sqrt(sinAl * sinAl + tmp * tmp));
  const lam = Math.atan2(sinSig * sinAl1, cosU1 * cosSig - sinU1 * sinSig * cosAl1);
  const C = f / 16 * cos2Al * (4 + f * (4 - 3 * cos2Al));
  const L = lam - (1 - C) * f * sinAl * (sig + C * sinSig * (cos2SigM + C * cosSig * (-1 + 2 * cos2SigM * cos2SigM)));
  return { lat: deg(lat2), lon: normLon(lonDeg + deg(L)) };
}

/** Full offset computation: body (x fwd, y right) + heading psi -> lat/lon. */
function computeOffset(lat, lon, x, y, psiDeg) {
  const p = rad(psiDeg), c = Math.cos(p), s = Math.sin(p);
  const north = x * c - y * s;
  const east  = x * s + y * c;
  const dist = Math.hypot(north, east);
  const bearing = dist === 0 ? norm360(psiDeg) : norm360(deg(Math.atan2(east, north)));
  const pt = vincentyDirect(lat, lon, bearing, dist);
  return { lat: pt.lat, lon: pt.lon, north, east, dist, bearing };
}

// ---------- Validation ----------
function parseNum(str) {
  const t = String(str).trim().replace(",", ".");
  if (t === "" || !/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return NaN;
  return Number(t);
}
const FIELDS = [
  { id: "lat", name: "Latitude", min: -90, max: 90 },
  { id: "lon", name: "Longitude", min: -180, max: 180 },
  { id: "x", name: "x offset", min: -2e7, max: 2e7 },
  { id: "y", name: "y offset", min: -2e7, max: 2e7 },
  { id: "psi", name: "Heading", min: 0, max: 360 },
];
function validate(raw) {
  const values = {}, errors = {};
  for (const f of FIELDS) {
    const v = parseNum(raw[f.id] ?? "");
    if (!Number.isFinite(v)) { errors[f.id] = (raw[f.id] ?? "").trim() === "" ? "Required" : "Not a number"; continue; }
    if (v < f.min || v > f.max) { errors[f.id] = `${f.name} must be ${f.min} to ${f.max}`; continue; }
    values[f.id] = v;
  }
  if (!errors.x && !errors.y && values.x !== undefined && Math.hypot(values.x, values.y) > 2e7)
    errors.x = "Offset too large (max ~20,000 km)";
  return { values, errors, ok: Object.keys(errors).length === 0 };
}

// ---------- Self-tests ----------
const dms = (d, m, s) => { const sign = d < 0 ? -1 : 1; return sign * (Math.abs(d) + m / 60 + s / 3600); };
function runSelfTests() {
  const T = [];
  const near = (name, got, want, tol) => T.push({ name, pass: Math.abs(got - want) <= tol, detail: `got ${got.toFixed(8)}, want ${want.toFixed(8)} (±${tol})` });

  // Classic Vincenty/Geoscience Australia direct test (Flinders Peak -> Buninyong)
  let r = vincentyDirect(dms(-37, 57, 3.72030), dms(144, 25, 29.52440), dms(306, 52, 5.37), 54972.271);
  near("Flinders Peak → Buninyong: lat", r.lat, dms(-37, 39, 10.15610), 1e-6);
  near("Flinders Peak → Buninyong: lon", r.lon, dms(143, 55, 35.38390), 1e-6);

  // Along the equator 1° of longitude = a·π/180 m
  r = computeOffset(0, 0, 6378137 * Math.PI / 180, 0, 90);
  near("Equator, 1° east: lon", r.lon, 1, 1e-8);
  near("Equator, 1° east: lat", r.lat, 0, 1e-8);

  // Equator to pole = quarter meridian 10,001,965.729 m
  r = computeOffset(0, 0, 10001965.729, 0, 0);
  near("Equator → North Pole: lat", r.lat, 90, 1e-6);

  // Body-frame rotation
  r = computeOffset(10, 10, 0, 100, 0);
  near("y=100 right, heading N → east offset", r.east, 100, 1e-9);
  r = computeOffset(10, 10, 100, 0, 90);
  near("x=100 fwd, heading E → east offset", r.east, 100, 1e-9);
  near("x=100 fwd, heading E → north offset", r.north, 0, 1e-9);
  r = computeOffset(10, 10, 100, 100, 180);
  near("x=100,y=100, heading S → north offset", r.north, -100, 1e-9);
  near("x=100,y=100, heading S → east offset", r.east, -100, 1e-9);

  // Zero offset
  r = computeOffset(51.5, -0.12, 0, 0, 45);
  near("Zero offset keeps lat", r.lat, 51.5, 1e-12);

  // Antimeridian wrap: 20 km east on the equator from 179.9999°
  r = computeOffset(0, 179.9999, 20000, 0, 90);
  near("Antimeridian wrap: lon", r.lon, 179.9999 + 20000 / (6378137 * Math.PI / 180) - 360, 1e-7);

  // Validation
  T.push({ name: "Validation rejects lat 91", pass: !validate({ lat: "91", lon: "0", x: "0", y: "0", psi: "0" }).ok, detail: "" });
  T.push({ name: "Validation rejects psi 361", pass: !validate({ lat: "0", lon: "0", x: "0", y: "0", psi: "361" }).ok, detail: "" });
  T.push({ name: "Validation accepts comma decimal", pass: validate({ lat: "1,5", lon: "0", x: "0", y: "0", psi: "0" }).ok, detail: "" });
  return T;
}

// ---------- UI ----------
if (typeof document !== "undefined") {
  const $ = id => document.getElementById(id);
  const HKEY = "coordOffset.history.v1", SKEY = "coordOffset.inputs.v1";
  const ids = FIELDS.map(f => f.id);
  let last = null;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const readRaw = () => Object.fromEntries(ids.map(i => [i, $(i).value]));
  const fmt7 = n => n.toFixed(7);
  const fmt2 = n => n.toFixed(2);
  const mapsUrl = (lat, lon) => `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function render() {
    const raw = readRaw();
    store.set(SKEY, raw);
    const v = validate(raw);
    const anyTouched = ids.some(i => raw[i].trim() !== "");
    for (const i of ids) {
      const show = v.errors[i] && (raw[i].trim() !== "" || submitted);
      $(i + "-e").textContent = show ? v.errors[i] : "";
      $(i + "-f").classList.toggle("invalid", !!show);
    }
    drawCompass(raw);
    if (!v.ok) {
      last = null;
      $("result").innerHTML = `<div class="empty placeholder">${anyTouched ? "Fix the highlighted fields to see the result." : "Enter valid inputs to see the result."}</div>`;
      return;
    }
    const { lat, lon, x, y, psi } = v.values;
    const r = computeOffset(lat, lon, x, y, psi);
    last = { input: v.values, out: r };
    const coords = `${fmt7(r.lat)}, ${fmt7(r.lon)}`;
    $("result").innerHTML = `
      <div class="hero">
        <div class="k">Target lat, lon</div>
        <div class="result-main" id="coords">${coords}</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">Latitude</div><div class="v">${fmt7(r.lat)}°</div></div>
        <div class="stat"><div class="k">Longitude</div><div class="v">${fmt7(r.lon)}°</div></div>
        <div class="stat"><div class="k">North offset</div><div class="v">${fmt2(r.north)} m</div></div>
        <div class="stat"><div class="k">East offset</div><div class="v">${fmt2(r.east)} m</div></div>
        <div class="stat"><div class="k">Distance</div><div class="v">${fmt2(r.dist)} m</div></div>
        <div class="stat"><div class="k">Bearing</div><div class="v">${r.bearing.toFixed(4)}°</div></div>
      </div>
      <div class="row">
        <button type="button" id="copy">Copy coordinates</button>
        <a class="btn" target="_blank" rel="noopener" href="${mapsUrl(lat, lon)}">Origin in Maps</a>
        <a class="btn" target="_blank" rel="noopener" href="${mapsUrl(fmt7(r.lat), fmt7(r.lon))}">Result in Maps</a>
      </div>
      <div class="toast" id="toast" role="status"></div>`;
    $("copy").onclick = () => copyText(coords);
  }

  // Compass preview: heading arrow, plus the target point when x, y, ψ are all valid.
  function drawCompass(raw) {
    const psi = parseNum(raw.psi), x = parseNum(raw.x), y = parseNum(raw.y);
    $("c-hdg").setAttribute("transform", `rotate(${Number.isFinite(psi) ? psi : 0})`);
    $("c-hdg").style.opacity = Number.isFinite(psi) ? 1 : .35;
    const pt = $("c-pt"), vec = $("c-vec");
    if (![psi, x, y].every(Number.isFinite) || (x === 0 && y === 0)) {
      pt.setAttribute("visibility", "hidden"); vec.setAttribute("visibility", "hidden"); return;
    }
    const p = rad(psi), north = x * Math.cos(p) - y * Math.sin(p), east = x * Math.sin(p) + y * Math.cos(p);
    const k = 70 / Math.hypot(north, east), px = east * k, py = -north * k;
    for (const [el, a, b] of [[pt, "cx", "cy"], [vec, "x2", "y2"]]) {
      el.setAttribute(a, px.toFixed(1)); el.setAttribute(b, py.toFixed(1)); el.setAttribute("visibility", "visible");
    }
  }

  async function copyText(text) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.cssText = "position:fixed;opacity:0;font-size:16px";
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch {}
      ta.remove();
    }
    const t = $("toast");
    if (t) { t.textContent = ok ? "Copied: " + text : "Copy failed — select the text manually."; t.style.color = ok ? "" : "var(--bad)"; }
  }

  // History
  function renderHistory() {
    const h = store.get(HKEY, []);
    if (!h.length) { $("history").innerHTML = '<span class="empty">No calculations saved yet. Press Calculate to save one.</span>'; return; }
    $("history").innerHTML = '<ul class="history">' + h.map((e, i) =>
      `<li><button type="button" data-i="${i}"><span><b>${fmt7(e.out.lat)}, ${fmt7(e.out.lon)}</b></span>
       <span class="small">from ${esc(e.input.lat)}, ${esc(e.input.lon)} · x ${esc(e.input.x)} m, y ${esc(e.input.y)} m, ψ ${esc(e.input.psi)}° · ${new Date(e.t).toLocaleString()}</span></button></li>`).join("") + "</ul>";
    $("history").querySelectorAll("button").forEach(b => b.onclick = () => {
      const e = store.get(HKEY, [])[+b.dataset.i];
      if (!e) return;
      for (const i of ids) $(i).value = String(e.input[i]);
      submitted = false; render(); window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }
  let submitted = false;
  $("form").addEventListener("submit", ev => {
    ev.preventDefault();
    submitted = true; render();
    if (last) {
      const h = store.get(HKEY, []);
      h.unshift({ t: Date.now(), input: last.input, out: { lat: last.out.lat, lon: last.out.lon } });
      store.set(HKEY, h.slice(0, 50));
      renderHistory();
    }
    document.activeElement && document.activeElement.blur();
  });
  ids.forEach(i => $(i).addEventListener("input", () => { submitted = false; render(); }));
  document.querySelectorAll("[data-pm]").forEach(b => b.onclick = () => {
    const el = $(b.dataset.pm), v = el.value.trim();
    el.value = v.startsWith("-") ? v.slice(1) : "-" + v;
    submitted = false; render();
  });
  $("reset").onclick = () => { ids.forEach(i => $(i).value = ""); submitted = false; render(); $("lat").focus(); };
  $("clear-history").onclick = () => { store.set(HKEY, []); renderHistory(); };
  $("run-tests").onclick = () => {
    const res = runSelfTests(), n = res.filter(t => t.pass).length;
    $("tests").innerHTML = `<li class="${n === res.length ? "pass" : "fail"}"><b>${n}/${res.length} passed</b></li>` +
      res.map(t => `<li class="${t.pass ? "pass" : "fail"}">${t.pass ? "✓" : "✗"} ${esc(t.name)}${t.detail ? `<br><span class="small">${esc(t.detail)}</span>` : ""}</li>`).join("");
  };

  const saved = store.get(SKEY, null);
  if (saved) ids.forEach(i => { if (typeof saved[i] === "string") $(i).value = saved[i]; });
  render(); renderHistory();
}
</script>
</body>
</html>
